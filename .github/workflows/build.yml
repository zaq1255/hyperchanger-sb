name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
      - name: Clone upstream HyperChanger
        run: git clone --depth 1 https://github.com/ColdP/HyperChanger.git upstream
      - name: Apply trim (if present)
        run: |
          if [ -f trim.py ]; then python3 trim.py upstream; fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Install Android NDK r30
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;30.0.16248370'
      - name: Configure NDK path
        working-directory: upstream
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK_ROOT=$SDK_ROOT"
          mkdir -p .build-tmp
          rm -rf .build-tmp/android-ndk-r30
          ln -s "$SDK_ROOT/ndk/30.0.16248370" .build-tmp/android-ndk-r30
          test -f .build-tmp/android-ndk-r30/source.properties
      - name: Build
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperChanger-debug
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
